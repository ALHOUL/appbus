name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libffi-dev python3-dev git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libssl-dev libgdbm-dev libsqlite3-dev \
            libreadline-dev tk-dev libgdbm-compat-dev libc6-dev libbz2-dev

      - name: Install Compatible Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<69.0.0"
          pip install "cython==0.29.33"
          pip install buildozer

      - name: Install Android API 33 & Prepare SDK
        run: |
          # قبول التراخيص وتثبيت API 33 وأدوات البناء
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"
          
          # نسخ حزمة Android SDK المكتملة إلى مجلد Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cp -r /usr/local/lib/android/sdk/* ~/.buildozer/android/platform/android-sdk/

      - name: Build APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: '1'
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BusApp-APK
          path: bin/*.apk
